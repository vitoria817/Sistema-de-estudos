<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anotações</title>
    <link rel="stylesheet" href="css/anotacoes.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont/dist/tabler-icons.min.css">
</head>
<body>
    <aside class="barra-lateral-notas">
  <button class="inicio btn-ir" data-destino="index.html"><i class="ti ti-home"></i>Início</button>
  <button class="Notas btn-ir" data-destino="notas.html"><i class="ti ti-notebook"></i>Notas</button>
  <button class="Agenda btn-ir" data-destino="agenda.html"><i class="ti ti-calendar"></i>Agenda</button>
  <button class="Tarefas btn-ir" data-destino="tarefas.html"><i class="ti ti-checklist"></i>Tarefas</button>
  <button class="Foco btn-ir" data-destino="foco.html"><i class="ti ti-clock"></i>Foco</button>
</aside>

    <div class="principal">

        <div class="coluna-lista">
            <div class="BuscarNotas">
                <i class="ti ti-search"></i>
                <input type="text" id="buscar" placeholder="Buscar notinhas...">
            </div>

            <div id="filtros"></div>

            <div id="listaNotas"></div>

            <button id="novaNota"><i class="ti ti-plus"></i> Nova nota</button>
        </div>

        <div class="coluna-editor">
            <div class="topo-editor">
                <input type="text" id="tituloNota" placeholder="Título da nota">
                <button id="favorita" title="Favoritar"><i class="ti ti-star"></i></button>
            </div>

            <div class="ferramentas">
                <button data-cmd="bold" title="Negrito"><i class="ti ti-bold"></i></button>
                <button data-cmd="italic" title="Itálico"><i class="ti ti-italic"></i></button>
                <button id="marcar" title="Marca-texto"><i class="ti ti-highlight"></i></button>
                <button data-cmd="insertUnorderedList" title="Lista"><i class="ti ti-list"></i></button>
                <button id="emoji" title="Emoji"><i class="ti ti-mood-smile"></i></button>
            </div>

            <div id="painelEmoji"></div>

            <div id="conteudo" contenteditable="true" data-ph="Escreva sua nota aqui:"></div>

            <div class="rodape-editor">
                <input type="text" id="materiaNota" placeholder="Matéria">
            </div>

            <div id="tagsVisiveis"></div>

            <button id="apagarNota"><i class="ti ti-trash"></i> Apagar nota</button>
        </div>

    </div>

    <script src="js/inicio.js"></script>
    <script src="js/notas.js"></script>
</body>
</html>

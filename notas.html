<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anotações</title>
    <link rel="stylesheet" href="css/anotacoes.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont/dist/tabler-icons.min.css">
</head>
<body>
    <aside class="barra-lateral-notas">
  <button class="inicio btn-ir" data-destino="inicio.html"><i class="ti ti-home"></i>Início</button>

  <button class="Agenda btn-ir" data-destino="agenda.html"><i class="ti ti-calendar"></i>Agenda</button>
  <button class="Tarefas btn-ir" data-destino="tarefas.html"><i class="ti ti-checklist"></i>Tarefas</button>

</aside>
    <!--parte de buscar notas-->
    <div class="BuscarNotas">
        <input type="text" id="buscar" placeholder="🔍Buscar notas...">
    </div>

    
        <div class="escrever-notas">
           <h1>Escreva suas notas aqui:</h1>
            <textarea id="notas" placeholder="Digite suas notas aqui..."></textarea>
          
            
        </div>
    
</body>
</html>

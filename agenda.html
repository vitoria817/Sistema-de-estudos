<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda</title>
  <link rel="stylesheet" href="css/agenda.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont/dist/tabler-icons.min.css">
</head>
<body>
  <aside class="barra-lateral">
    <button class="inicio btn-ir" data-destino="index.html"><i class="ti ti-home"></i>Início</button>
    <button class="Notas btn-ir" data-destino="notas.html"><i class="ti ti-notebook"></i>Notas</button>
    <button class="Agenda btn-ir" data-destino="agenda.html"><i class="ti ti-calendar"></i>Agenda</button>
    <button class="Tarefas btn-ir" data-destino="tarefas.html"><i class="ti ti-checklist"></i>Tarefas</button>
    <button class="Foco btn-ir" data-destino="foco.html"><i class="ti ti-clock"></i>Foco</button>
  </aside>

  <!-- dias do mês da agenda -->
  <section class="agenda">
    <div class="calendario">
      <div class="agenda-topo">
        <button onclick="mudarMes(-1)">‹</button>
        <h2 id="titulo"></h2>
        <button onclick="mudarMes(1)">›</button>
      </div>

      <div class="dias-semana">
        <span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span>
      </div>

      <div class="dias" id="dias"></div>
    </div>

    <div class="novoCompromisso">
      <div id="listaCompromissos"></div>

      <input type="text" id="DigiteCompromisso" placeholder="Digite o compromisso...">
      <input type="time" id="HoraCompromisso">
      <button id="botaoCompromisso">+ Novo compromisso</button>
    </div>
  </section>

  <script src="js/inicio.js"></script>
  <script src="js/agenda.js"></script>
</body>
</html>

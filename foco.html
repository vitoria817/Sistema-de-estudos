<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador</title>
    <link rel="stylesheet" href="css/foco.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont/dist/tabler-icons.min.css">

</head>
<body>
<aside class="barra-lateral">
   <button class="inicio btn-ir" data-destino="index.html"><i class="ti ti-home"></i>Início</button>
  <button class="Notas btn-ir" data-destino="notas.html"><i class="ti ti-notebook"></i>Notas</button>
  <button class="Agenda btn-ir" data-destino="agenda.html"><i class="ti ti-calendar"></i>Agenda</button>
  <button class="Tarefas btn-ir" data-destino="tarefas.html"><i class="ti ti-checklist"></i>Tarefas</button>
  <button class="Foco btn-ir" data-destino="foco.html"><i class="ti ti-clock"></i>Foco</button>
</aside>

<!-- NOVO: wrapper para colocar o contador e a lista lado a lado -->
<div class="focoPagina">

    <div class="containerContador">
        <div class="contador">
           <div class="circulo">
    <input type="text" id="contador" value="00:00" readonly>

</div>
        </div>
        <div class="botoesCronometro">
           <button id="pausar" onclick="pausarContador()">Pausa</button>
            <button id="Pomodoro25" onclick="pomodoro()">Pomodoro</button>
        </div>
        
    </div>

    <!-- NOVO: lista de tarefas -->
    <section class="painelTarefas">
        <ul id="listaTarefas"></ul>
        <input type="text" id="novaTarefa" placeholder="+ Nova tarefa (Enter para adicionar)" maxlength="60">
    </section>

</div>

    <script src="js/foco.js"></script>
    <script src="js/inicio.js"></script>
</body>
</html>
